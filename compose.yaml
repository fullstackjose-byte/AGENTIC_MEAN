name: helpdesk-agents

services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://helpdesk:helpdesk_dev@postgres:5432/helpdesk?schema=public
      LLM_PROVIDER: mock
      AUTH_MODE: ${AUTH_MODE:-mock}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-{}}
      OIDC_ALLOWED_ALGORITHMS: ${OIDC_ALLOWED_ALGORITHMS:-RS256}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace:cached
      - root-node-modules:/workspace/node_modules
      - api-node-modules:/workspace/apps/api/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - pnpm-store:/pnpm/store
    ports:
      - "4200:4200"
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  pnpm-store:
  root-node-modules:
  api-node-modules:
  web-node-modules:
